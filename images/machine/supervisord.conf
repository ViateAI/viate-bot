[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/log/supervisor/supervisord.pid

[program:xvfb]
command=/opt/viate/xvfb.sh
user=root
autorestart=true
startsecs=1
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err

[program:chromium]
command=/opt/viate/chromium.sh
user=bot
autorestart=true
startsecs=3
startretries=20
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
environment=HOME="/home/bot",USER="bot",LOGNAME="bot",DISPLAY=":1",XDG_RUNTIME_DIR="/tmp/runtime-bot",LANG="C.UTF-8",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
stdout_logfile=/var/log/supervisor/chromium.log
stderr_logfile=/var/log/supervisor/chromium.err

[program:machined]
command=/usr/bin/node /opt/viate/machined.mjs
user=root
autorestart=true
stdout_logfile=/var/log/supervisor/machined.log
stderr_logfile=/var/log/supervisor/machined.err
stopsignal=TERM
stopwaitsecs=10
